[package]
name = "museum-pdf-tool"
version = "1.0.0"
description = "A secure, local PDF processing tool for museums"
authors = ["Museum Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
pdf-extract = "0.7"
image = "0.24"
base64 = "0.21"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"